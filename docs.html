<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <title>Vampirefall 核心知识库</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Vampirefall Core Knowledge Base">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.staticfile.net/docsify/4.13.1/themes/vue.css">
  <!-- Prism CSS for better code highlighting -->
  <link rel="stylesheet" href="https://cdn.staticfile.net/prism/1.29.0/themes/prism-tomorrow.min.css">
  <style>
    :root {
      --lark-blue: #3370FF;
      --lark-bg-sidebar: #F5F6F7;
      --lark-text-primary: #1F2329;
      --lark-text-secondary: #646A73;
      --lark-hover-bg: #E4E6EB; /* Slightly darker than sidebar for hover */
      --lark-active-bg: #E1EAFF;
    }

    /* Global Typography */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      color: var(--lark-text-primary);
      -webkit-font-smoothing: antialiased;
    }

    /* Sidebar Styling */
    .sidebar {
      background-color: var(--lark-bg-sidebar);
      border-right: none;
      width: 280px;
      padding-top: 20px;
    }
    
    .sidebar ul li a {
      color: var(--lark-text-primary);
      font-size: 14px;
      border-radius: 6px;
      padding: 8px 12px;
      margin: 2px 8px;
      transition: all 0.2s ease;
      text-decoration: none;
      border: none !important; /* Remove default docsify borders */
    }

    .sidebar ul li a:hover {
      background-color: var(--lark-hover-bg);
      text-decoration: none;
    }

    .sidebar ul li.active > a {
      background-color: var(--lark-active-bg);
      color: var(--lark-blue);
      font-weight: 500;
      border-right: none;
    }

    /* Remove default docsify arrows/decorations if possible or style them */
    .app-sub-sidebar li:before {
      display: none; 
    }

    /* Main Content Layout */
    .content {
      padding-top: 40px;
      padding-bottom: 60px;
    }

    .markdown-section {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 40px;
    }

    /* Header Styling */
    .markdown-section h1, .markdown-section h2, .markdown-section h3 {
      font-weight: 600;
      color: var(--lark-text-primary);
    }
    
    .markdown-section h1 { font-size: 32px; margin-bottom: 24px; }
    .markdown-section h2 { font-size: 24px; margin-top: 40px; margin-bottom: 16px; border-bottom: none; }
    .markdown-section h3 { font-size: 20px; margin-top: 24px; margin-bottom: 12px; }

    /* Blockquote (Callout) */
    .markdown-section blockquote {
      border-left: 4px solid var(--lark-blue);
      background: #F8F9FA;
      color: var(--lark-text-secondary);
      margin: 2em 0;
      padding: 12px 20px;
      border-radius: 0 4px 4px 0;
    }

    /* Code Blocks */
    .markdown-section pre {
      background-color: #F5F6F7;
      border-radius: 8px;
      font-family: 'JetBrains Mono', Consolas, Monaco, monospace;
    }
    
    /* Mermaid Background */
    .mermaid {
      background: white;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #DEE0E3;
    }
  </style>
</head>
<body>
  <div id="app">🏃‍♂️ 正在加载 Vampirefall 知识库...</div>
  <script>
    window.docsify = {
      name: '🦇 Vampirefall Docs',
      repo: '', 
      homepage: 'README.md',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,

      subMaxLevel: 3,
      auto2top: true,
      
      // Search Plugin Config
      search: {
        maxAge: 86400000, 
        paths: 'auto',
        placeholder: '🔍 搜索文档...',
        noData: '😒 找不到结果',
        depth: 6
      },
      
      // Mermaid Config
      mermaidConfig: {
        querySelector: ".mermaid"
      },

      // Copy Code Plugin
      copyCode: {
        buttonText : '复制代码',
        errorText  : 'Error',
        successText: '已复制'
      }
    }
  </script>
  
  <!-- Docsify v4 -->
  <script src="https://cdn.staticfile.net/docsify/4.13.1/docsify.min.js"></script>
  
  <!-- Plugins -->
  <script src="https://cdn.staticfile.net/docsify/4.13.1/plugins/search.min.js"></script>
  <script src="https://cdn.staticfile.net/docsify/4.13.1/plugins/zoom-image.min.js"></script>
  
  <!-- Syntax Highlighting -->
  <script src="https://cdn.staticfile.net/prism/1.29.0/components/prism-csharp.min.js"></script>
  <script src="https://cdn.staticfile.net/prism/1.29.0/components/prism-json.min.js"></script>
  <script src="https://cdn.staticfile.net/prism/1.29.0/components/prism-bash.min.js"></script>
  <script src="https://cdn.staticfile.net/prism/1.29.0/components/prism-yaml.min.js"></script>

  
  <!-- Use unpkg for copy-code as it is robust enough, or switch if needed -->
  <script src="//unpkg.com/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  
  <!-- Mermaid Support -->
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: false });
    window.mermaid = mermaid;
  </script>
  <script src="//unpkg.com/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>

</body>
</html>
