# MkDocs 配置文件 - 游戏开发101
# 文档: https://squidfunk.github.io/mkdocs-material/

site_name: 游戏开发101
site_description: 游戏开发101 - 数值设计、规则与技术标准
site_url: https://lsc1414.github.io/Game_Num_Basics_And_Calc/

# 目录配置
docs_dir: docs

# 链接校验策略
# 保留无后缀链接（如 NAVIGATION.md / Full_Index.md 中的 /docs/... 或 xxx/yyy 形式），
# 仅关闭这类“无法识别的相对链接”提示，真正的坏链(not_found)仍继续告警。
validation:
  links:
    unrecognized_links: ignore

# 仓库信息 (可选，显示在右上角)
repo_url: https://github.com/lsc1414/Game_Num_Basics_And_Calc
repo_name: Game_Num_Basics_And_Calc

# 主题配置
theme:
  name: material
  favicon: assets/favicon.png
  language: zh

  # 调色板 (深色/浅色模式切换)
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式

  # 功能特性
  features:
    - navigation.instant # 即时加载 (SPA 体验)
    - navigation.instant.progress # 加载进度条
    - navigation.tracking # URL 跟踪锚点
    - navigation.tabs # 顶部标签页导航
    - navigation.tabs.sticky # 标签页固定
    - navigation.sections # 侧边栏分组
    - navigation.expand # 默认展开侧边栏
    - navigation.indexes # 分类索引页
    - navigation.top # 返回顶部按钮
    - search.suggest # 搜索建议
    - search.highlight # 搜索高亮
    - search.share # 搜索分享
    - content.code.copy # 代码复制按钮
    - content.code.annotate # 代码注释
    - toc.follow # 目录跟随滚动

  # 图标
  icon:
    logo: material/gamepad-variant
    repo: fontawesome/brands/github

# 插件
plugins:
  - search:
      lang:
        - zh
        - en
      separator: '[\s\-\.]+'
  # - mermaid2  # 如果需要 Mermaid 图表，取消注释

# Markdown 扩展
markdown_extensions:
  # Python Markdown 扩展
  - abbr
  - admonition # 告示框 (NOTE/WARNING 等)
  - attr_list # 属性列表
  - def_list # 定义列表
  - footnotes # 脚注
  - md_in_html # HTML 中嵌入 Markdown
  - tables # 表格
  - mdx_truly_sane_lists # 支持 2 空格嵌套列表
  - toc:
      permalink: true # 标题永久链接
      toc_depth: 3

  # PyMdown 扩展
  - pymdownx.arithmatex: # 数学公式
      generic: true
  - pymdownx.betterem # 更好的强调
  - pymdownx.caret # 上标
  - pymdownx.details # 可折叠块
  - pymdownx.emoji: # Emoji
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight: # 代码高亮
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite # 行内代码高亮
  - pymdownx.keys # 键盘按键
  - pymdownx.mark # 高亮标记
  - pymdownx.smartsymbols # 智能符号
  - pymdownx.superfences: # 超级围栏 (Mermaid 等)
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: # 标签页
      alternate_style: true
  - pymdownx.tasklist: # 任务列表
      custom_checkbox: true
  - pymdownx.tilde # 删除线/下标

# 额外配置
extra:
  # 社交链接
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lsc1414

  # 页面分析 (可选)
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX

# 数学公式支持 (MathJax)
extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js

extra_css:
  - stylesheets/extra.css

