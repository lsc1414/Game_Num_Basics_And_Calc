<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="UTF-8">
  <title>Vampirefall 核心知识库</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Vampirefall Core Knowledge Base">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.staticfile.net/docsify/4.13.1/themes/vue.css">
  <style>
    /* Custom tweaks */
    .sidebar {
      width: 280px;
    }
    .content {
      padding-top: 20px;
    }
    /* Mermaid fix for specific theme */
    .mermaid {
      background: white;
      padding: 10px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="app">🏃‍♂️ 正在加载 Vampirefall 知识库...</div>
  <script>
    window.docsify = {
      name: '🦇 Vampirefall Docs',
      repo: '', 
      homepage: 'README.md', // Updated to match case
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      
      // Search Plugin Config
      search: {
        maxAge: 86400000, 
        paths: 'auto',
        placeholder: '🔍 搜索文档...',
        noData: '😒 找不到结果',
        depth: 6
      },
      
      // Mermaid Config
      mermaidConfig: {
        querySelector: ".mermaid"
      },

      // Copy Code Plugin
      copyCode: {
        buttonText : '复制代码',
        errorText  : 'Error',
        successText: '已复制'
      }
    }
  </script>
  
  <!-- Docsify v4 -->
  <script src="https://cdn.staticfile.net/docsify/4.13.1/docsify.min.js"></script>
  
  <!-- Plugins -->
  <script src="https://cdn.staticfile.net/docsify/4.13.1/plugins/search.min.js"></script>
  <script src="https://cdn.staticfile.net/docsify/4.13.1/plugins/zoom-image.min.js"></script>
  
  <!-- Use unpkg for copy-code as it is robust enough, or switch if needed -->
  <script src="//unpkg.com/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  
  <!-- Mermaid Support -->
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
    mermaid.initialize({ startOnLoad: false });
    window.mermaid = mermaid;
  </script>
  <script src="//unpkg.com/docsify-mermaid@2.0.1/dist/docsify-mermaid.js"></script>

</body>
</html>
