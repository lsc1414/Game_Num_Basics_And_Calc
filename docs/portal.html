      :root {
        --bg-color: #f8f9fa;
        --text-color: #212529;
        --card-bg: #ffffff;
        --card-border: #dee2e6;
        --accent-color: #228be6;
        --tag-bg: #e9ecef;
        --tag-text: #495057;
        --input-bg: #ffffff;
        --header-bg: #ffffff;
        --shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }

      [data-theme="dark"] {
        --bg-color: #1a1b1e;
        --text-color: #c1c2c5;
        --card-bg: #25262b;
        --card-border: #2c2e33;
        --accent-color: #339af0;
        --tag-bg: #2c2e33;
        --tag-text: #a5d8ff;
        --input-bg: #25262b;
        --header-bg: #141517;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
      }

      * {
        box-sizing: border-box;
        transition: background-color 0.2s, color 0.1s;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        margin: 0;
        background: var(--bg-color);
        color: var(--text-color);
      }

      header {
        background: var(--header-bg);
        padding: 1.5rem 2rem;
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: var(--shadow);
        border-bottom: 1px solid var(--card-border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      h1 {
        margin: 0;
        font-size: 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .theme-toggle {
        cursor: pointer;
        font-size: 1.5rem;
        background: none;
        border: none;
        color: var(--text-color);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem;
      }

      .search-container {
        margin-bottom: 2rem;
      }
      #search-input {
        width: 100%;
        padding: 1rem 1.5rem;
        font-size: 1.1rem;
        border: 2px solid var(--card-border);
        border-radius: 12px;
        background: var(--input-bg);
        color: var(--text-color);
        outline: none;
      }
      #search-input:focus {
        border-color: var(--accent-color);
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 2rem;
      }
      .filter-btn {
        padding: 0.5rem 1rem;
        border: 1px solid var(--card-border);
        border-radius: 20px;
        background: var(--card-bg);
        color: var(--text-color);
        cursor: pointer;
        font-size: 0.95rem;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      .filter-btn:hover {
        border-color: var(--accent-color);
      }
      .filter-btn.active {
        background: var(--accent-color);
        color: white;
        border-color: var(--accent-color);
      }

      .role-shortcuts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1rem;
        margin-bottom: 2rem;
        padding: 1.5rem;
        background: var(--card-bg);
        border-radius: 12px;
        border: 1px solid var(--card-border);
      }
      .role-card {
        text-align: center;
        padding: 1rem;
        border-radius: 8px;
        background: var(--bg-color);
        cursor: pointer;
        border: 1px solid transparent;
      }
      .role-card:hover {
        border-color: var(--accent-color);
        transform: translateY(-2px);
      }
      .role-title {
        font-weight: bold;
        margin-bottom: 0.5rem;
        display: block;
      }
      .role-desc {
        font-size: 0.8rem;
        opacity: 0.7;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1.5rem;
      }
      .card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 1.5rem;
        position: relative;
        text-decoration: none;
        color: var(--text-color);
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow);
        border-color: var(--accent-color);
      }
      .card-icon {
        font-size: 2rem;
        margin-bottom: 1rem;
      }
      .card-title {
        font-weight: 600;
        font-size: 1.1rem;
        margin-bottom: 0.5rem;
        line-height: 1.4;
        color: var(--accent-color);
      }
      .card-desc {
        font-size: 0.9rem;
        opacity: 0.8;
        line-height: 1.5;
        flex-grow: 1;
      }
      .card-meta {
        margin-top: 1rem;
        font-size: 0.8rem;
        opacity: 0.5;
        display: flex;
        justify-content: space-between;
      }
      .new-tag {
        position: absolute;
        top: 1rem;
        right: 1rem;
        background: #ff6b6b;
        color: white;
        font-size: 0.7rem;
        padding: 2px 6px;
        border-radius: 4px;
        font-weight: bold;
      }

      @media (max-width: 768px) {
        .container {
          padding: 1rem;
        }
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>

      let currentFilter = "all";

      function init() {
        const filterContainer = document.getElementById("filter-container");
        filterContainer.innerHTML =
          `<button class="filter-btn active" onclick="setFilter('all')">📚 全部</button>` +
          categories
            .map(
              (c) =>
                `<button class="filter-btn" onclick="setFilter('${c.id}')">${c.icon} ${c.name}</button>`
            )
            .join("");

        renderDocs();

        // Load Theme
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
          document.querySelector(".theme-toggle").textContent = "🌞";
        }
      }

      function toggleTheme() {
        const html = document.documentElement;
        const current = html.getAttribute("data-theme");
        const next = current === "dark" ? "light" : "dark";
        html.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
        document.querySelector(".theme-toggle").textContent =
          next === "dark" ? "🌙" : "🌞";
      }

      function setFilter(cat) {
        currentFilter = cat;
        document.querySelectorAll(".filter-btn").forEach((btn) => {
          btn.classList.toggle(
            "active",
            btn.textContent.includes(
              categories.find((c) => c.id === cat)?.name || "全部"
            )
          );
        });
        renderDocs();
      }

      function filterByRole(role) {
        // Clear search
        document.getElementById("search-input").value = "";
        currentFilter = "all"; // Reset cat filter to let role take precedence visually or just filter
        const filtered = docs.filter(
          (d) => d.role.includes(role) || d.role.includes("all")
        );
        renderGrid(filtered);

        // Update styling to show we are in a special mode?
        // For simplicity, just rendering.
        window.scrollTo({
          top: document.getElementById("doc-grid").offsetTop - 100,
          behavior: "smooth",
        });
      }

      function renderDocs() {
        const query = document
          .getElementById("search-input")
          .value.toLowerCase();
        let filtered = docs;

        if (currentFilter !== "all") {
          filtered = filtered.filter((d) => d.cat === currentFilter);
        }

        if (query) {
          filtered = filtered.filter(
            (d) =>
              d.title.toLowerCase().includes(query) ||
              d.desc.toLowerCase().includes(query) ||
              d.path.toLowerCase().includes(query)
          );
        }

        renderGrid(filtered);
      }

      function renderGrid(items) {
        const grid = document.getElementById("doc-grid");
        if (items.length === 0) {
          grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; opacity: 0.5; padding: 2rem;">没有找到相关文档 🍃</div>`;
          return;
        }

        grid.innerHTML = items
          .map((doc) => {
            const cat = categories.find((c) => c.id === doc.cat);
            return `
                <a href="${doc.path}" class="card">
                    <div class="card-icon">${cat ? cat.icon : "📄"}</div>
                    <div class="card-title">${doc.title}</div>
                    <div class="card-desc">${doc.desc}</div>
                    <div class="card-meta">
                        <span>${cat ? cat.name : "文档"}</span>
                        <span>🔗 打开</span>
                    </div>
                </a>
            `;
          })
          .join("");
      }

      init();
    </script>
